<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant</title>
    <!-- Include the Puter.js SDK -->
    <script src="https://puter.com"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        body { 
            font-family: 'Courier New', Courier, monospace; 
            background-color: #000000; 
            color: #ffffff;
            margin: 0; 
            padding: 40px 20px; 
            display: flex; 
            flex-direction: column;
            min-height: 100vh;
        }
        .main-layout {
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            flex: 1;
        }
        .site-header { 
            color: #ffffff; 
            padding-bottom: 20px; 
            font-size: 1.2rem; 
            font-weight: bold; 
            border-bottom: 1px solid #ffffff;
            letter-spacing: 1px;
        }
        .chat-area { 
            flex: 1; 
            padding: 30px 0; 
            display: flex; 
            flex-direction: column; 
            gap: 24px; 
        }
        .message-row {
            display: flex;
            flex-direction: column;
            width: 100%;
        }
        .sender-label {
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 4px;
            letter-spacing: 1px;
        }
        .message-text { 
            line-height: 1.6;
            font-size: 1rem;
            white-space: pre-wrap;
        }
        .image-wrapper {
            margin-top: 12px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 10px;
        }
        .generated-image {
            max-width: 100%;
            max-height: 500px;
            border: 1px solid #ffffff;
        }
        .download-btn {
            background: #000000;
            color: #ffffff;
            border: 1px solid #ffffff;
            padding: 6px 14px;
            font-size: 0.8rem;
            cursor: pointer;
            font-family: inherit;
            text-transform: uppercase;
        }
        .download-btn:hover {
            background: #ffffff;
            color: #000000;
        }
        .input-wrapper { 
            display: flex; 
            border-top: 1px solid #ffffff; 
            padding-top: 20px; 
            margin-top: auto;
        }
        input { 
            flex: 1; 
            padding: 14px; 
            background: #000000;
            border: 1px solid #ffffff; 
            color: #ffffff;
            font-size: 1rem; 
            outline: none; 
            font-family: inherit;
        }
        button { 
            background: #000000; 
            color: #ffffff; 
            border: 1px solid #ffffff; 
            padding: 0 30px; 
            margin-left: 12px; 
            cursor: pointer; 
            font-size: 1rem; 
            font-family: inherit;
            text-transform: uppercase;
        }
        button:hover { 
            background: #ffffff; 
            color: #000000;
        }
        button:disabled, input:disabled { 
            opacity: 0.5;
            cursor: not-allowed; 
        }
    </style>
</head>
<body>

<div class="main-layout">
    <div class="site-header">AI CORE INTERFACE</div>
    <div class="chat-area" id="chatArea">
        <div class="message-row">
            <div class="sender-label">AI:</div>
            <div class="message-text">Interface ready. Type naturally to chat, or execute "/image [description]" to generate visual assets.</div>
        </div>
    </div>
    <div class="input-wrapper">
        <input type="text" id="userInput" placeholder="Type a message or /image command..." onkeydown="if(event.key === 'Enter') handleInput()">
        <button id="sendBtn" onclick="handleInput()">Send</button>
    </div>
</div>

<script>
    const chatArea = document.getElementById('chatArea');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');

    let conversationHistory = [
        { role: 'system', content: 'You are a stark, minimal AI assistant. Provide clean, direct text outputs without formatting fluff.' }
    ];

    function appendMessage(text, isUser, complexElement = null) {
        const row = document.createElement('div');
        row.classList.add('message-row');

        const label = document.createElement('div');
        label.classList.add('sender-label');
        label.innerText = isUser ? 'YOU:' : 'AI:';
        row.appendChild(label);

        if (text) {
            const body = document.createElement('div');
            body.classList.add('message-text');
            body.innerText = text;
            row.appendChild(body);
        }

        if (complexElement) {
            row.appendChild(complexElement);
        }
        
        chatArea.appendChild(row);
        window.scrollTo(0, document.body.scrollHeight);
    }

    async function handleInput() {
        const text = userInput.value.trim();
        if (!text) return;

        appendMessage(text, true);
        userInput.value = '';
        
        userInput.disabled = true;
        sendBtn.disabled = true;

        if (text.toLowerCase().startsWith('/image ')) {
            const prompt = text.substring(7); 
            await generateAIImage(prompt);
        } else {
            await streamTextChat(text);
        }

        userInput.disabled = false;
        sendBtn.disabled = false;
        userInput.focus();
    }

    async function streamTextChat(userText) {
        conversationHistory.push({ role: 'user', content: userText });

        const loadingRow = document.createElement('div');
        loadingRow.classList.add('message-row');
        loadingRow.innerHTML = '<div class="sender-label">AI:</div><div class="message-text">Processing request...</div>';
        chatArea.appendChild(loadingRow);

        try {
            const response = await puter.ai.chat(conversationHistory, { model: 'openai/gpt-5.5' });
            loadingRow.remove();
            
            let aiText = "";
            if (response && response.message && response.message.content) {
                aiText = response.message.content;
            } else if (typeof response === 'string') {
                aiText = response; 
            } else {
                aiText = JSON.stringify(response);
            }

            appendMessage(aiText, false);
            conversationHistory.push({ role: 'assistant', content: aiText });
        } catch (error) {
            loadingRow.remove();
            appendMessage("Error: Failed to connect to core service.", false);
            console.error(error);
        }
    }

    async function generateAIImage(promptText) {
        const loadingRow = document.createElement('div');
        loadingRow.classList.add('message-row');
        loadingRow.innerHTML = `<div class="sender-label">AI:</div><div class="message-text">Synthesizing image for: "${promptText}"...</div>`;
        chatArea.appendChild(loadingRow);

        try {
            const imgElement = await puter.ai.txt2img(promptText, { model: 'gpt-image-2.5-flare' });
            loadingRow.remove();
            
            let finalSrc = "";
            if (imgElement instanceof HTMLElement) {
                finalSrc = imgElement.src;
            } else if (imgElement && imgElement.src) {
                finalSrc = imgElement.src;
            }

            if (finalSrc) {
                const wrapper = document.createElement('div');
                wrapper.classList.add('image-wrapper');

                const newImg = document.createElement('img');
                newImg.src = finalSrc;
                newImg.classList.add('generated-image');
                wrapper.appendChild(newImg);

                // Add Download Button functionality
                const dlBtn = document.createElement('button');
                dlBtn.classList.add('download-btn');
                dlBtn.innerText = "Download Image";
                dlBtn.onclick = async () => {
                    try {
                        const response = await fetch(finalSrc);
                        const blob = await response.blob();
                        const blobUrl = URL.createObjectURL(blob);
                        
                        const link = document.createElement('a');
                        link.href = blobUrl;
                        link.download = `ai-image-${Date.now()}.png`;
                        document.body.appendChild(link);
                        link.click();
                        document.body.removeChild(link);
                        URL.revokeObjectURL(blobUrl);
                    } catch (e) {
                        // Fallback open in case of CORS limits on browser configurations
                        window.open(finalSrc, '_blank');
                    }
                };
                wrapper.appendChild(dlBtn);

                appendMessage(`Asset rendered for: "${promptText}"`, false, wrapper);
            } else {
                appendMessage("Error: Output missing visual format.", false);
            }
        } catch (error) {
            loadingRow.remove();
            appendMessage("Error: Failed to construct visual request.", false);
            console.error(error);
        }
    }
</script>

</body>
</html>
