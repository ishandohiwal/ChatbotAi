<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futuristic AI Console</title>
    <!-- Include the Puter.js SDK -->
    <script src="https://js.puter.com/v2/"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: #111827;
            --neon-cyan: #00f2fe;
            --neon-pink: #f35588;
            --text-main: #e5e7eb;
            --border-color: #1f2937;
        }
        body { 
            font-family: 'Courier New', Courier, monospace; 
            background-color: var(--bg-color); 
            color: var(--text-main);
            margin: 0; 
            padding: 20px; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            height: 90vh;
        }
        .chat-container { 
            width: 100%; 
            max-width: 700px; 
            background: var(--panel-bg); 
            border-radius: 12px; 
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.2); 
            display: flex; 
            flex-direction: column; 
            height: 80vh; 
            overflow: hidden; 
        }
        .chat-header { 
            background: #1f2937; 
            color: var(--neon-cyan); 
            padding: 15px; 
            font-size: 1.1rem; 
            font-weight: bold; 
            text-align: center; 
            border-bottom: 2px solid var(--neon-cyan);
            letter-spacing: 2px;
            text-shadow: 0 0 5px rgba(0, 242, 254, 0.6);
        }
        .chat-box { 
            flex: 1; 
            padding: 20px; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            background: radial-gradient(circle at top, #161d30, #0b0f19);
        }
        .message { 
            padding: 12px 16px; 
            border-radius: 8px; 
            max-width: 80%; 
            word-wrap: break-word; 
            line-height: 1.5;
            font-size: 0.95rem;
        }
        .user-msg { 
            background: rgba(0, 242, 254, 0.1); 
            align-self: flex-end; 
            color: var(--neon-cyan); 
            border: 1px solid var(--neon-cyan);
            box-shadow: 0 0 8px rgba(0, 242, 254, 0.2);
        }
        .ai-msg { 
            background: rgba(243, 85, 136, 0.1); 
            align-self: flex-start; 
            color: #ff7ebb; 
            border: 1px solid var(--neon-pink);
            box-shadow: 0 0 8px rgba(243, 85, 136, 0.2);
        }
        .generated-image {
            max-width: 100%;
            border-radius: 8px;
            border: 2px solid var(--neon-cyan);
            margin-top: 8px;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
        }
        .input-area { 
            display: flex; 
            border-top: 2px solid var(--border-color); 
            padding: 15px; 
            background: var(--panel-bg); 
        }
        input { 
            flex: 1; 
            padding: 12px; 
            background: #0b0f19;
            border: 1px solid var(--border-color); 
            color: var(--text-main);
            border-radius: 6px; 
            font-size: 1rem; 
            outline: none; 
        }
        input:focus {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 8px rgba(0, 242, 254, 0.3);
        }
        button { 
            background: transparent; 
            color: var(--neon-cyan); 
            border: 1px solid var(--neon-cyan); 
            padding: 0 25px; 
            margin-left: 12px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 1rem; 
            font-family: inherit;
            text-transform: uppercase;
            transition: all 0.3s;
        }
        button:hover { 
            background: var(--neon-cyan); 
            color: #000;
            box-shadow: 0 0 15px var(--neon-cyan);
        }
        button:disabled { 
            border-color: #4b5563;
            color: #4b5563; 
            cursor: not-allowed; 
            box-shadow: none;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">SYSTEM CORE // AI CONSOLE v2.6</div>
    <div class="chat-box" id="chatBox">
        <div class="message ai-msg">INITIALIZED... Type naturally to chat, or type "/image [description]" to synthesize graphics.</div>
    </div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Query terminal or build image..." onkeydown="if(event.key === 'Enter') handleInput()">
        <button id="sendBtn" onclick="handleInput()">Execute</button>
    </div>
</div>

<script>
    const chatBox = document.getElementById('chatBox');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');

    // 1. Maintain conversation context history dynamically
    let conversationHistory = [
        { role: 'system', content: 'You are a futuristic terminal assistant. Keep responses relatively concise and cyberpunk-themed.' }
    ];

    function appendMessage(text, isUser, elementToAppend = null) {
        const msgDiv = document.createElement('div');
        msgDiv.classList.add('message', isUser ? 'user-msg' : 'ai-msg');
        
        if (text) {
            msgDiv.innerText = text;
        }
        if (elementToAppend) {
            msgDiv.appendChild(elementToAppend);
        }
        
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function handleInput() {
        const text = userInput.value.trim();
        if (!text) return;

        // Display user input text
        appendMessage(text, true);
        userInput.value = '';
        
        // Lock interactive UI
        userInput.disabled = true;
        sendBtn.disabled = true;

        // Check if the user is calling the OpenAI image generator
        if (text.toLowerCase().startsWith('/image ')) {
            const prompt = text.substring(7); // Strip off the "/image " prefix
            await generateAIImage(prompt);
        } else {
            await streamTextChat(text);
        }

        // Unlock interactive UI
        userInput.disabled = false;
        sendBtn.disabled = false;
        userInput.focus();
    }

    // 2. Chat method that appends and preserves operational context history
    async function streamTextChat(userText) {
        // Track context history
        conversationHistory.push({ role: 'user', content: userText });

        const loadingDiv = document.createElement('div');
        loadingDiv.classList.add('message', 'ai-msg');
        loadingDiv.innerText = "COMPUTING MULTI-TURN DATA...";
        chatBox.appendChild(loadingDiv);

        try {
            // Puter.js accepts an array directly to carry the historical context state
            const response = await puter.ai.chat(conversationHistory, { model: 'openai/gpt-5.5' });
            
            loadingDiv.remove();
            
            // Append response text to the UI layout
            appendMessage(response, false);

            // Record response structure back into history array for next prompts
            conversationHistory.push({ role: 'assistant', content: response });
        } catch (error) {
            loadingDiv.remove();
            appendMessage("SYSTEM CRITICAL ERROR: Communication thread failed.", false);
            console.error(error);
        }
    }

    // 3. Puter OpenAI Image Generation Integration
    async function generateAIImage(promptText) {
        const loadingDiv = document.createElement('div');
        loadingDiv.classList.add('message', 'ai-msg');
        loadingDiv.innerText = `SYNTHESIZING GRAPHIC RESOURCE: "${promptText}"...`;
        chatBox.appendChild(loadingDiv);

        try {
            // Puter built-in txt2img leverages OpenAI graphics engine layers completely free
            const imgElement = await puter.ai.txt2img(promptText, { model: 'gpt-image-2.5-flare' });
            
            loadingDiv.remove();
            
            // Format returning object into styles matching dark design layout
            imgElement.classList.add('generated-image');
            
            // Inject into UI stack
            appendMessage(`Graphic successfully compiled for prompt: "${promptText}"`, false, imgElement);
        } catch (error) {
            loadingDiv.remove();
            appendMessage("GRAPHICS RENDERING ERROR: Failed to process graphic sequence.", false);
            console.error(error);
        }
    }
</script>

</body>
</html>
